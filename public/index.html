<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adora's Grill</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; color: #222; background: #fffaf3; }
    header { padding: 2rem 1rem; text-align: center; background: #2b2118; color: #fff; }
    header h1 { margin: 0 0 .5rem; }
    header p { margin: 0; opacity: .85; }
    main { max-width: 960px; margin: 0 auto; padding: 1.5rem 1rem; }
    .menu { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.25rem; }
    .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .card .photo { aspect-ratio: 4 / 3; background: #eadfcf; display: flex; align-items: center; justify-content: center; color: #8a7a66; font-size: .9rem; padding: 1rem; box-sizing: border-box; text-align: center; line-height: 1.4; }
    .card .photo img { width: 100%; height: 100%; object-fit: cover; }
    .card .body { padding: 1rem 1.1rem 1.2rem; }
    .card h3 { margin: 0 0 .4rem; font-size: 1.05rem; line-height: 1.3; }
    .card .desc { margin: 0 0 .6rem; font-size: .9rem; line-height: 1.45; color: #555; }
    .card .price { font-weight: 600; line-height: 1.3; }
    .placeholder { color: #8a7a66; font-style: italic; font-weight: 400; }
    main section h2 { margin: 0 0 1rem; }
    .status { text-align: center; color: #777; padding: 2rem 0; }
    .ctas { text-align: center; margin-top: 2rem; }
    .cta { display: inline-block; padding: .8rem 1.4rem; background: #b5452b; color: #fff; border-radius: 8px; text-decoration: none; }
    footer { text-align: center; color: #777; padding: 2rem 1rem 2.5rem; font-size: .9rem; }
    footer p { margin: 0; }
    header h1 { line-height: 1.2; }
  </style>
</head>
<body>
  <header>
    <h1>Adora's Grill</h1>
    <p>Behind Anthony's Barbershop</p>
  </header>

  <main>
    <section>
      <h2>Menu</h2>
      <div id="menu" class="menu"><p class="status">Loading menu…</p></div>
    </section>

    <div class="ctas">
      <!-- PLACEHOLDER: replace href with the Square Online link -->
      <a class="cta" href="#">Order Online</a>
    </div>
  </main>

  <footer>
    <!-- PLACEHOLDER: street address -->
    <p class="placeholder">Street address coming soon</p>
  </footer>

  <script>
    (async function () {
      const grid = document.getElementById('menu');
      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }
      try {
        const res = await fetch('/api/menu');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const { items } = await res.json();
        if (!items.length) { grid.innerHTML = '<p class="status">Menu is being updated. Check back soon.</p>'; return; }
        grid.innerHTML = items.map(item => `
          <article class="card">
            <div class="photo">${item.image ? `<img src="${esc(item.image)}" alt="${esc(item.name)}" loading="lazy">` : '<span class="placeholder">Photo coming soon</span>'}</div>
            <div class="body">
              <h3>${esc(item.name)}</h3>
              ${item.description ? `<p class="desc">${esc(item.description)}</p>` : ''}
              <div class="price${item.price ? '' : ' placeholder'}">${item.price ? esc(item.price) : 'Price coming soon'}</div>
            </div>
          </article>`).join('');
      } catch (err) {
        grid.innerHTML = '<p class="status">Menu is unavailable right now. Please try again later.</p>';
      }
    })();
  </script>
</body>
</html>
